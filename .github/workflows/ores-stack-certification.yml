name: ores-stack certification

on:
  push:
    branches:
      - test/ores-stack-certification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiducia-test-ores-stack-certification
  cancel-in-progress: true

jobs:
  public-contract-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Fiducia test consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Check out api-docs page-build authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/api-docs
          ref: DEN-3960-rust-fs-routing
          path: deps/api-docs
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Compile api-docs page-build authority
        run: cargo check --manifest-path deps/api-docs/rust/Cargo.toml

      - name: Run focused page-build authority tests
        run: |
          cargo test --manifest-path deps/api-docs/rust/Cargo.toml fs_route -- --nocapture
          cargo test --manifest-path deps/api-docs/rust/Cargo.toml module_analysis -- --nocapture
          cargo test --manifest-path deps/api-docs/rust/Cargo.toml page_build -- --nocapture
          cargo test --manifest-path deps/api-docs/rust/Cargo.toml page_router_codegen -- --nocapture

      - name: Run external Fiducia consumer fixture
        run: cargo run --manifest-path ores-stack-contract-smoke/Cargo.toml

  private-build-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Detect protected test-fleet credential
        id: credential
        shell: bash
        env:
          TEST_FLEET_READ_TOKEN: ${{ secrets.TEST_FLEET_READ_TOKEN }}
        run: |
          set -euo pipefail
          if test -n "$TEST_FLEET_READ_TOKEN"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'protected source access is configured'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'protected source access is not configured; private ores-stack lifecycle is skipped'
          fi

      - name: Check out private ores-stack branch
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-stack
          ref: feat/next-build-style-cli
          token: ${{ secrets.TEST_FLEET_READ_TOKEN }}
          path: ores-stack
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.88.0
        if: steps.credential.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Run ores-stack build/dev certification
        if: steps.credential.outputs.available == 'true'
        working-directory: ores-stack
        run: bash scripts/ci-build-dev-smoke.sh

      - name: Collect certification evidence
        if: always() && steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          test -f ores-stack/Cargo.lock && cp ores-stack/Cargo.lock evidence/Cargo.lock || true
          test -d ores-stack/fixtures/axum-web-server/.ores-stack && cp -R ores-stack/fixtures/axum-web-server/.ores-stack evidence/fixture-ores-stack || true
          for f in /tmp/ores-stack-build-server.log /tmp/ores-stack-dev.log /tmp/ores-stack-build-root.html /tmp/ores-stack-build-user.html /tmp/ores-stack-dev-before.html /tmp/ores-stack-dev-after.html /tmp/ores-stack-dev-during-broken.html /tmp/ores-stack-dev-restored.html; do
            test -f "$f" && cp "$f" evidence/ || true
          done

      - name: Upload certification evidence
        if: always() && steps.credential.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-stack-certification-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
